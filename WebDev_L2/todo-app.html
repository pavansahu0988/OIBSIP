<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7FB; --surface:#FFFFFF; --ink:#161A2B; --muted:#6E7488;
    --accent:#5B5FEF; --accent-soft:#EDECFE; --done:#12B76A; --done-soft:#E6F9EF;
    --danger:#F04438; --danger-soft:#FDEDEC; --line:#E7E9F2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; padding:40px 16px calc(40px + env(safe-area-inset-bottom,0px));
    padding-top:calc(40px + env(safe-area-inset-top,0px));
  }
  h1,h2{font-family:'Plus Jakarta Sans', sans-serif; font-weight:700;}
  .app{max-width:660px; margin:0 auto;}
  .app-head{text-align:center; margin-bottom:28px;}
  .app-head h1{font-size:1.8rem; margin-bottom:6px;}
  .app-head p{color:var(--muted); font-size:0.95rem;}

  .add-row{display:flex; gap:10px; margin-bottom:32px;}
  #taskInput{
    flex:1; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px;
    font-family:'IBM Plex Sans', sans-serif; font-size:1rem; background:var(--surface); color:var(--ink);
    transition:border-color .2s ease;
  }
  #taskInput:focus{outline:none; border-color:var(--accent);}
  #addBtn{
    background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 22px;
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:0.95rem; cursor:pointer;
    transition:background .2s ease, transform .1s ease; white-space:nowrap;
  }
  #addBtn:hover{background:#4A4EDB;}
  #addBtn:active{transform:scale(0.97);}

  .lists{display:flex; flex-direction:column; gap:34px;}
  .list-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .list-head h2{font-size:1.05rem;}
  .count{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:0.78rem;
    padding:3px 10px; border-radius:12px; background:var(--accent-soft); color:var(--accent);
  }
  .count.done{background:var(--done-soft); color:var(--done);}

  .task-list{display:flex; flex-direction:column; gap:10px; min-height:8px;}

  .task{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 14px;
    display:flex; align-items:flex-start; gap:12px; transition:opacity .2s ease, transform .2s ease;
  }
  .task.completed{background:#FBFCFE;}

  .check{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:1px;
    transition:border-color .2s ease, background .2s ease;
  }
  .check:hover{border-color:var(--accent);}
  .task.completed .check{background:var(--done); border-color:var(--done);}
  .check svg{width:12px; height:12px; color:#fff; opacity:0; transition:opacity .15s ease;}
  .task.completed .check svg{opacity:1;}

  .task-body{flex:1; min-width:0;}
  .task-text{font-size:0.98rem; word-break:break-word;}
  .task.completed .task-text{color:var(--muted); text-decoration:line-through;}
  .task-time{font-size:0.78rem; color:var(--muted); margin-top:4px;}
  .edit-input{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:0.98rem; padding:6px 8px;
    border:1.5px solid var(--accent); border-radius:8px; background:var(--bg); color:var(--ink);
  }
  .edit-input:focus{outline:none;}

  .task-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:none; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--muted);
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{background:var(--accent-soft); color:var(--accent);}
  .icon-btn.del:hover{background:var(--danger-soft); color:var(--danger);}
  .icon-btn svg{width:16px; height:16px;}

  .empty{
    text-align:center; padding:26px 16px; color:var(--muted); font-size:0.92rem;
    background:var(--surface); border:1.5px dashed var(--line); border-radius:12px;
  }

  @media (max-width:480px){
    .add-row{flex-direction:column;}
    #addBtn{padding:13px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="app-head">
    <h1>My Tasks</h1>
    <p>Add, complete, edit, and clear your day — saved right in this browser.</p>
  </div>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="What do you need to do?" autocomplete="off">
    <button id="addBtn">Add Task</button>
  </div>

  <div class="lists">
    <div>
      <div class="list-head">
        <h2>Pending</h2>
        <span class="count" id="pendingCount">0 pending</span>
      </div>
      <div class="task-list" id="pendingList"></div>
    </div>

    <div>
      <div class="list-head">
        <h2>Completed</h2>
        <span class="count done" id="completedCount">0 completed</span>
      </div>
      <div class="task-list" id="completedList"></div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo-tasks-v1';
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const pendingList = document.getElementById('pendingList');
  const completedList = document.getElementById('completedList');
  const pendingCount = document.getElementById('pendingCount');
  const completedCount = document.getElementById('completedCount');

  let tasks = [];
  let editingId = null;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){ tasks = []; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function formatTime(ts){
    if(!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    if(sameDay) return `Today, ${time}`;
    return `${d.toLocaleDateString([], {month:'short', day:'numeric'})}, ${time}`;
  }

  function addTask(text){
    const t = text.trim();
    if(!t) return;
    tasks.unshift({ id: uid(), text: t, completed: false, createdAt: Date.now(), completedAt: null });
    save(); render();
  }

  function toggleComplete(id){
    const task = tasks.find(t => t.id === id);
    if(!task) return;
    task.completed = !task.completed;
    task.completedAt = task.completed ? Date.now() : null;
    save(); render();
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  function startEdit(id){
    editingId = id;
    render();
  }

  function saveEdit(id, newText){
    const t = newText.trim();
    const task = tasks.find(x => x.id === id);
    if(task && t) task.text = t;
    editingId = null;
    save(); render();
  }

  function cancelEdit(){
    editingId = null;
    render();
  }

  function taskNode(task){
    const el = document.createElement('div');
    el.className = 'task' + (task.completed ? ' completed' : '');

    const check = document.createElement('div');
    check.className = 'check';
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    check.addEventListener('click', () => toggleComplete(task.id));
    el.appendChild(check);

    const body = document.createElement('div');
    body.className = 'task-body';

    if(editingId === task.id){
      const input = document.createElement('input');
      input.className = 'edit-input';
      input.type = 'text';
      input.value = task.text;
      body.appendChild(input);
      setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') saveEdit(task.id, input.value);
        else if(e.key === 'Escape') cancelEdit();
      });
      input.addEventListener('blur', () => saveEdit(task.id, input.value));
    } else {
      const textEl = document.createElement('div');
      textEl.className = 'task-text';
      textEl.textContent = task.text;
      body.appendChild(textEl);

      const timeEl = document.createElement('div');
      timeEl.className = 'task-time';
      timeEl.textContent = task.completed
        ? `Completed ${formatTime(task.completedAt)} · Added ${formatTime(task.createdAt)}`
        : `Added ${formatTime(task.createdAt)}`;
      body.appendChild(timeEl);
    }
    el.appendChild(body);

    const actions = document.createElement('div');
    actions.className = 'task-actions';

    if(editingId !== task.id){
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.setAttribute('aria-label', 'Edit task');
      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
      editBtn.addEventListener('click', () => startEdit(task.id));
      actions.appendChild(editBtn);
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del';
    delBtn.setAttribute('aria-label', 'Delete task');
    delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
    delBtn.addEventListener('click', () => deleteTask(task.id));
    actions.appendChild(delBtn);

    el.appendChild(actions);
    return el;
  }

  function emptyNode(msg){
    const el = document.createElement('div');
    el.className = 'empty';
    el.textContent = msg;
    return el;
  }

  function render(){
    const pending = tasks.filter(t => !t.completed);
    const completed = tasks.filter(t => t.completed).sort((a,b) => (b.completedAt||0) - (a.completedAt||0));

    pendingCount.textContent = `${pending.length} pending`;
    completedCount.textContent = `${completed.length} completed`;

    pendingList.innerHTML = '';
    if(pending.length === 0){
      pendingList.appendChild(emptyNode('Nothing pending — add a task above to get started.'));
    } else {
      pending.forEach(t => pendingList.appendChild(taskNode(t)));
    }

    completedList.innerHTML = '';
    if(completed.length === 0){
      completedList.appendChild(emptyNode('No completed tasks yet.'));
    } else {
      completed.forEach(t => completedList.appendChild(taskNode(t)));
    }
  }

  addBtn.addEventListener('click', () => { addTask(taskInput.value); taskInput.value = ''; taskInput.focus(); });
  taskInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ addTask(taskInput.value); taskInput.value = ''; }
  });

  load();
  render();
</script>
</body>
</html>
